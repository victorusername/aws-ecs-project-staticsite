<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS ECS Portfolio Project</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 40px;
            border-radius: 8px;
            background-color: #1e1e1e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h1 { color: #00ffcc; }
        .tag {
            display: inline-block;
            background-color: #333;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, World </h1>
        <h2>Deploy Automatizado com ECS & Terraform</h2>
        <div class="tags">
            <span class="tag">Docker</span>
            <span class="tag">Terraform</span>
            <span class="tag">GitHub Actions</span>
            <span class="tag">Nginx</span>
        </div>
    </div>
</body>
</html>
